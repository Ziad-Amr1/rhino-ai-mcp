[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rhino-ai-mcp"
version = "1.0.0"
description = "General-purpose AI Model Context Protocol (MCP) server & live bridge for Rhinoceros 3D (Rhino 8 & 9)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Ziad Amr" }
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]

[project.urls]
Homepage = "https://github.com/Ziad-Amr1/rhino-ai-mcp"
Repository = "https://github.com/Ziad-Amr1/rhino-ai-mcp"
