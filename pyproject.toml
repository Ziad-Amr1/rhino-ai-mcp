[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rhino-ai-mcp"
version = "1.0.0"
description = "General-purpose AI Model Context Protocol (MCP) server & live bridge for Rhinoceros 3D (Rhino 8 & 9)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Ziad Amr" }
]
keywords = [
    "rhino",
    "rhino3d",
    "rhino8",
    "rhinoceros",
    "mcp",
    "model-context-protocol",
    "ai-agent",
    "antigravity",
    "cad-automation",
    "computational-design"
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]

[project.scripts]
rhino-mcp = "mcp_server:main"
rhino-cli = "rhino_client:main"

[project.urls]
Homepage = "https://github.com/Ziad-Amr1/rhino-ai-mcp"
Repository = "https://github.com/Ziad-Amr1/rhino-ai-mcp"
Issues = "https://github.com/Ziad-Amr1/rhino-ai-mcp/issues"

[tool.setuptools]
py-modules = ["mcp_server", "rhino_bridge", "rhino_client", "run_backend"]
packages = ["mcp_schemas"]

[tool.setuptools.package-data]
mcp_schemas = ["*.json", "*.md"]
